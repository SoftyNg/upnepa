name: upnepa
description: "A new Flutter project."
publish_to: 'none' # Prevents accidental publishing

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  firebase_auth: ^6.1.3
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  flutter_tts: ^4.2.3
  share_plus: ^12.0.1
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/small_logo.png
    - assets/images/woman.png
    - assets/images/onboarding.png
    - assets/images/whatsapp.png
    - assets/images/no_transactions.png
    - assets/icon/whatsapp_icon.png
    - assets/logos/abuja.png
    - assets/logos/ikeja.png
    - assets/logos/eko.png
